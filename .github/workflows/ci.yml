name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python — lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The unit tests only need the signal pipeline, so skip the heavy ML deps (torch etc.)
      - run: pip install numpy pandas pytest ruff && pip install -e ml --no-deps
      - run: ruff check ml
        working-directory: .
      - run: pytest -q
        working-directory: ml

  web:
    name: Web — lint, parity tests, build, end-to-end smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SMOKE_OUT: smoke-output
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: web/smoke-output
          if-no-files-found: ignore
